name: WRT-CORE

on:
  workflow_call:
    inputs:
      TARGET:
        required: true
        type: string
      REPO_SOURCE:
        required: true
        type: string
      REPO_URL:
        required: true
        type: string
      REPO_BRANCH:
        required: true
        type: string
      CONFIG_FILE:
        required: true
        type: string

env:
  TARGET: ${{inputs.TARGET}}
  REPO_SOURCE: ${{inputs.REPO_SOURCE}}
  REPO_URL: ${{inputs.REPO_URL}}
  REPO_BRANCH: ${{inputs.REPO_BRANCH}}
  CONFIG_FILE: ${{inputs.CONFIG_FILE}}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev          
          curl -fL --retry 3 https://build-scripts.immortalwrt.org/init_build_environment.sh -o "$RUNNER_TEMP/init-build.sh"
          sudo bash "$RUNNER_TEMP/init-build.sh"
          sudo timedatectl set-timezone "$TZ"
          git config --global user.email "aa@163.com"
          git config --global user.name "aa"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cd openwrt
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

      - name: Cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: true
          mixkey: ${{env.TARGET}}-${{env.REPO_SOURCE}}-${{env.REPO_BRANCH}}-${{env.WRT_HASH}}-${{ hashFiles(inputs.CONFIG_FILE) }}
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Update Feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a        

      - name: Check Scripts
        run: |
          dos2unix "$GITHUB_WORKSPACE"/scripts/*.sh
          bash -n "$GITHUB_WORKSPACE/scripts/Packages.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/Handles.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/Fixes.sh"
          bash -n "$GITHUB_WORKSPACE/scripts/Settings.sh"

      - name: Custom Packages
        run: |
          cd ./openwrt/package/
          : > ../custom-package-revisions.txt
          bash "$GITHUB_WORKSPACE/scripts/Packages.sh"
          bash "$GITHUB_WORKSPACE/scripts/Handles.sh"
          cd ..
          ./scripts/feeds install -a

      - name: Custom Settings
        run: |
          test -f "$CONFIG_FILE"
          cp "$CONFIG_FILE" openwrt/.config
          
          bash "$GITHUB_WORKSPACE/scripts/Fixes.sh"
          cd ./openwrt
          bash "$GITHUB_WORKSPACE/scripts/Settings.sh"

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV          

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success'  && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*

          # 保留上游镜像名，使 profiles.json 等清单的引用保持有效。
          rm -rf packages
          cp "$GITHUB_WORKSPACE/openwrt/.config" build.config
          (cd "$GITHUB_WORKSPACE/openwrt" && ./scripts/diffconfig.sh) > build.diffconfig
          {
            printf 'build-config: %s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            printf 'source: %s\n' "$(git -C "$GITHUB_WORKSPACE/openwrt" rev-parse HEAD)"
            for feed in "$GITHUB_WORKSPACE/openwrt"/feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                printf '%s: %s\n' "$(basename "$feed")" "$(git -C "$feed" rev-parse HEAD)"
              fi
            done
            cat "$GITHUB_WORKSPACE/openwrt/custom-package-revisions.txt"
          } > build-revisions.txt
          # 重新生成校验清单，包含构建记录。
          find . -maxdepth 1 -type f ! -name sha256sums -print0 | sort -z | xargs -0 -r sha256sum > sha256sums
          sha256sum -c sha256sums
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate Plugin List
        id: plugins
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt
          echo "PLUGIN_BODY<<EOF" >> $GITHUB_ENV
          echo "### 📦 已集成的核心插件列表：" >> $GITHUB_ENV
          awk -F= '/^CONFIG_PACKAGE_luci-app-.*=y$/ {sub(/^CONFIG_PACKAGE_/, "", $1); print $1}' .config >> "$GITHUB_ENV"
          echo "EOF" >> $GITHUB_ENV

      - name: Release Firmware
        uses: softprops/action-gh-release@v2.1.0
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ env.TARGET }}_${{ env.FILE_DATE }}_${{ github.run_number }}_${{ github.run_attempt }}
          files: ${{ env.FIRMWARE }}/*
          body: |
            🌐 **【设备默认信息】**
            后台地址：`192.168.1.1`
            默认密码：无 (留空直接登录)
            Wi-Fi 配置：以设备与源码默认设置为准；nowifi 构建不包含无线功能。

            ⚙️ **【编译核心参数】**
            编译平台：${{ env.TARGET }}
            源码仓库：${{ env.REPO_URL }}
            源码分支：${{ env.REPO_BRANCH }}
            源码提交：${{ env.WRT_HASH }}
            编译时间：${{ env.DATE }}

            ${{ env.PLUGIN_BODY }}

